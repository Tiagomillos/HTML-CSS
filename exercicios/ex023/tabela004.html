<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafios de tabela</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
           border-collapse: collapse;

        }


        caption {
            font-size: 1.3em;
            font-weight: bold;
            padding: 10px;
            background-color: brown;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
           
        }
        
       thead {
        background-color: yellow;

       }
       
    </style>
</head>
<body>
    <h1>Exercício de tabela</h1>

    <table>
        <caption>
            Linguagens Favoritas
        </caption>

        <thead>
            <tr>
                <th scope="col">Grupos</th>
                <th scope="col">Nomes</th>
                <th colspan="3" scope="colgroup">Linguagens</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <th rowspan="3" scope="rowgroup">Mulheres</th>
                <td>Ana</td>
                <td>Kotlin</td>
                <td>C#</td>
                <td>PHP</td>
            </tr>

            <tr>
                <td>Bianca</td>
                <td>Java</td>
                <td>C</td>
                <td>TypeScript</td>
            </tr>

            <tr>
                <td>Caterine</td>
                <td>Cobol</td>
                <td>Ruby</td>
                <td>Lua</td>
            </tr>

            <tr>
                <th rowspan="3" scope="rowgroup">Homens</th>
                <td>Tiago</td>
                <td>Java</td>
                <td>PHP</td>
                <td>Python</td>
            </tr>

            <tr>
                <td>Rogerio</td>
                <td>Bash</td>
                <td>Elixir</td>
                <td>Dart</td>
            </tr>

            <tr>
                <td>Gustavo</td>
                <td>Rust</td>
                <td>Assembly</td>
                <td>Lisp</td>
            </tr>
        </tbody>
    </table>

    
</body>
</html>
