<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color:#735736 ;
        }

        h1 {
            color: white;
        }

        table {
            width: 500px;
            border-collapse: collapse;
            color: white;
        }

        caption {
            font-size: 1.5em;
            font-weight: bolder;
            padding: 10px;


        }

        td, th {
            border: 2px solid white;
            padding: 10px;

        }

        col.cnome {
            background-color: rgb(173, 44, 44);
        }
    </style>
</head>
<body>
    <h1>Exercício de Tabelas</h1>

    <table>
        <colgroup>
            <col class="cnome">
            <col class="csexo">
            <col class="cidade">
            <col class="cprof">
        </colgroup>
        <caption>Cadastro</caption>

        <tr>
            <th scope="col">Nome</th>
            <th scope="col">Sexo</th>
            <th scope="col">Idade</th>
            <th scope="col">Profissão</th>
        </tr>
        <tr>
            <td>Marta</td>
            <td>F</td>
            <td>38</td>
            <td>Zeladora</td>
        </tr>
        <tr>
            <td>João</td>
            <td>M</td>
            <td>45</td>
            <td>Pedreiro</td>
        </tr>
        <tr>
            <td>Maria</td>
            <td>F</td>
            <td>29</td>
            <td>Professora</td>
        </tr>
        <tr>
            <td>José</td>
            <td>M</td>
            <td>50</td>
            <td>Engenheiro</td>
        </tr>
        <tr>
            <td>Ana</td>
            <td>F</td>
            <td>32</td>
            <td>Arquiteta</td>
        </tr>
        <tr>
            <td>Pedro</td>
            <td>M</td>
            <td>28</td>
            <td>Designer</td>
        </tr>
    </table>

    
</body>
</html>
