<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="src/icons/favicon.ico" type="image/x-icon" />
    <title>Mídias em HTML5</title>
  </head>
  <body>
    <h1><mark style="background-color: brown">Imagem dinâmica</mark></h1>
    <p>
      Tente abrir este site em vários dispositivos diferentes ou simplesmente
      aumente e diminua o tamanho do seu navegador.
    </p>
    <picture>
      <source
        media="(max-width:750px )"
        srcset="src/imagens/foto-p.png"
        type="image/png"
      />
      <source
        media="(max-width:1050px )"
        srcset="src/imagens/foto-m.png"
        type="image/png"
      />
      <img src="src/imagens/foto-g.png" alt="imagem flexível" />
    </picture>

    <h1>Reproduzindo Áudio</h1>
    <p>Vamos aprender reproduzir audio em HTML 5.</p>
    <audio preload="metadata" autoplay controls loop>
      <source
        src="Donations (Sting) - Riot.mp3
       "
        type="audio/mpeg"
      />
      <source src="src/Donations (Sting) - Riot.mp3" type="audio/ogg" />
      <source src="src/Donations (Sting) - Riot.wav" type="audio/wav" />
      <p>
        Infelizmente seu navegador não consegue reproduzir áudio.
        <a href="src/Donations (Sting) - Riot.mp3"
          >Clique aqui para baixar o arquivo MP3.</a
        >
      </p>
    </audio>
  </body>
</html>
