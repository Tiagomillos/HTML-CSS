<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=
    , initial-scale=1.0">
    <title>Desafio de notas</title>
    <link rel="shortcut icon" href="icons/faviorb.ico" type="image/x-icon">
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: #794518;
        }

        h1 {
            font-weight: bold;
            color: white;
        }

        table {
            border-collapse: collapse;
            
            
        }

        .cabecalho {
            font-size: 1.3em;
            font-weight: bold;
            padding: 10px;
            background-color:#351a02 ;
            color: white;
           
        }


        th, td {
            border: 1px solid rgb(255, 233, 233);
            padding: 10px;
            color: white;


        }

        .notax {
            text-align: right;
        }

    </style>
</head>
<body>
    <h1>Desafio de tabela de notas</h1>
    <table>
  <thead class="cabecalho">
    <tr>
      <th scope="col" rowspan="2">Área</th>
      <th scope="col" rowspan="2">Disciplina</th>
      <th scope="colgroup" colspan="2">Notas</th>
      <th scope="col" rowspan="2">Média</th>
    </tr>
    <tr>
      <th scope="col">Nota 1</th>
      <th scope="col">Nota 2</th>
    </tr>
  </thead>

  <tbody>
    <!-- Exatas -->
    <tr>
      <th scope="rowgroup" rowspan="4">Exatas</th>
      <th>Matemática</th>
      <td class="num">8.0</td>
      <td class="num">7.5</td>
      <td class="num">7.75</td>
    </tr>
    <tr>
      <th>Física</th>
      <td class="num">0.0</td>
      <td class="num">0.0</td>
      <td class="num">0.0</td>
    </tr>
    <tr>
      <th>Química</th>
      <td class="num">7.0</td>
      <td class="num">8.0</td>
      <td class="num">7.5</td>
    </tr>
    <tr>
      <th>Biologia</th>
      <td class="num">0.0</td>
      <td class="num">0.0</td>
      <td class="num">0.0</td>
    </tr>

    <!-- Média de Exatas -->
    <tr class="cabecalho">
      <th  scope="col" colspan="4">Média de Exatas</th>
      <td class="num">0.0</td>
    </tr>

    <!-- Humanas -->
    <tr>
      <th scope="rowgroup" rowspan="2">Humanas</th>
      <th>História</th>
      <td class="num">0.0</td>
      <td class="num">0.0</td>
      <td class="num">0.0</td>
    </tr>
    <tr>
      <th>Geografia</th>
      <td class="num">0.0</td>
      <td class="num">0.0</td>
      <td class="num">0.0</td>
    </tr>

    <tr class="cabecalho">
        <th scope="col" colspan="4">Média de Humanas</th>
        <td class="num">0.0</td>
    </tr>

  </tbody>
</table>



        </tbody>
    </table>

   
    
</body>
</html>
